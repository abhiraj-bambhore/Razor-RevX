name: CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: razorpay-recovery-app

jobs:
  # ==========================================
  # STEP 1: CI VERIFICATION GATE
  # ==========================================
  ci-check:
    name: 1. CI Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Tests (CI Gate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SIMULATE_MODE: "true"
        run: |
          pytest -v

  # ==========================================
  # STEP 2: DOCKER BUILD IMAGE
  # ==========================================
  docker-build:
    name: 2. Docker Build Image
    needs: ci-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}, ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker Image Artifact
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/docker-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  # ==========================================
  # STEP 3: RUN CONTAINER (Verification / Smoke Test)
  # ==========================================
  run-container:
    name: 3. Run Container & Verify
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load -i /tmp/docker-image.tar

      - name: Run Container (Smoke Test - Help/CLI Execution)
        run: |
          echo "🐳 Starting container to verify runtime execution..."
          docker run --rm \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e SIMULATE_MODE="true" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} python -c "import src; print('Application package loaded successfully in container!')"

      - name: Run Background Container & Health Check
        run: |
          echo "🐳 Running container in background..."
          docker run -d --name test-app -p 8000:8000 \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e SIMULATE_MODE="true" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Allow container 5 seconds to initialize
          sleep 5
          
          # Inspect container status
          CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' test-app)
          echo "Container status: $CONTAINER_STATUS"
          
          # Fetch and print container logs
          echo "=== Container Logs ==="
          docker logs test-app
          
          # Stop and remove test container
          docker stop test-app && docker rm test-app

  # ==========================================
  # STEP 4: DEPLOYMENT (Continuous Delivery)
  # ==========================================
  deploy:
    name: 4. Deploy Application
    needs: run-container
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Deploy Validated Container
        run: |
          echo "🚀 Deployment triggered for environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Container image ${{ env.IMAGE_NAME }}:${{ github.sha }} verified and ready for production deployment."
